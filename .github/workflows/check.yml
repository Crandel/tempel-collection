name: check

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      el: ${{ steps.filter.outputs.el }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            el:
              - '*.el'
              - '.github/workflows/check.yml'
            templates:
              - 'templates/**'
              - 'scripts/check-templates.el'

  check:
    needs: changes
    if: needs.changes.outputs.el == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 31.1
          - snapshot
        ignore_warnings:
          - true
        include:
          - emacs_version: snapshot
            ignore_warnings: false
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - uses: leotaku/elisp-check@v1.4.1
        with:
          file: "*.el"
          ignore_warnings: ${{ matrix.ignore_warnings }}

  templates:
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: purcell/setup-emacs@v8.0
        with:
          version: 31.1
      - name: Validate template data files
        run: emacs --batch -l scripts/check-templates.el -f check-templates
